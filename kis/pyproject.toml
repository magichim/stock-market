[project]
name = "stock-market-kis"
version = "0.1.0"
description = "한국투자증권 Open API 샘플(open-trading-api)을 HTTP로 구동하는 게이트웨이"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn[standard]",
    # vendor/examples_llm 이 쓰는 패키지
    "pandas>=2.3.1",
    "pycryptodome>=3.23.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
