[project]
name = "stock-market-backend"
version = "0.1.0"
description = "FastAPI backend for stock.agisaja.com"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pyjwt",
    "pydantic-settings",
    "uvicorn[standard]",
    "asyncpg>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "redis>=8.1.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
